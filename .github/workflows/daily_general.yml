name: Biotech Catalyst General Master Report Daily Run

on:
  schedule:
    # Runs daily at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual run from GitHub Actions UI

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Master General Report Agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_SITE_ID: ${{ secrets.WP_SITE_ID }}
          WP_OAUTH_TOKEN: ${{ secrets.WP_OAUTH_TOKEN }}
          PUBLISH_STATUS: "publish"
        run: |
          python general.py
