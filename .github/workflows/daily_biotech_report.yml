name: Daily Biotech Report to WordPress

on:
  schedule:
    - cron: "0 13 * * *"   # Runs daily at 13:00 UTC
  workflow_dispatch:        # Manual execution trigger

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser openai tqdm requests python-dotenv

      - name: Run report publisher
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          CATEGORY_NAME: "Oncology"
          SUBCATEGORY_NAME: "RAS Pathway Targeted Small Molecule Inhibitors"
          PUBLISH_STATUS: "publish" # Change to 'draft' if you prefer to manually review posts
        run: |
          python main.py
