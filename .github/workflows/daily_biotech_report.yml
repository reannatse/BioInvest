name: Biotech Catalyst Agent Daily Run

on:
  schedule:
    # Runs daily at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      category_name:
        description: 'Category Name (e.g., Oncology, Neuroscience, Immunology, Anti-diabetics, AI Drug Discovery(AIDD))'
        required: false
        default: 'Oncology'
      subcategory_name:
        description: 'Subcategory Name (e.g., RAS Pathway Targeted Small Molecule Inhibitors)'
        required: false
        default: 'RAS Pathway Targeted Small Molecule Inhibitors'

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # caching pip dependencies for faster runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Biotech Catalyst Agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_SITE_ID: ${{ secrets.WP_SITE_ID }}
          WP_OAUTH_TOKEN: ${{ secrets.WP_OAUTH_TOKEN }}
          PUBLISH_STATUS: "publish"
          CATEGORY_NAME: ${{ github.event.inputs.category_name || 'Oncology' }}
          SUBCATEGORY_NAME: ${{ github.event.inputs.subcategory_name || 'RAS Pathway Targeted Small Molecule Inhibitors' }}
        run: |
          python agent.py
