name: Biotech Catalyst Agent Run

on:
  schedule:
    # Runs daily at 08:00 UTC (defaults to All General Categories)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      category_name:
        description: 'Select Primary Category:'
        required: true
        default: 'All General Categories'
        type: choice
        options:
          - 'All General Categories'
          - 'Oncology'
          - 'Neuroscience'
          - 'Immunology'
          - 'Anti-diabetics'
          - 'AI Drug Discovery (AIDD)'

      subcategory_name:
        description: 'Select Subcategory (Overrides Primary Category if set to anything other than None):'
        required: true
        default: 'None (Use Primary Category selection)'
        type: choice
        options:
          - 'None (Use Primary Category selection)'
          # Oncology Subcategories
          - 'General Oncology'
          - 'RAS Pathway Targeted Small Molecule Inhibitors'
          - 'KRAS G12C Inhibitors'
          - 'KRAS G12D / Multi-KRAS Inhibitors'
          - 'Pan-RAS & Direct RAS Inhibitors'
          - 'EGFR & HER2 Directed Small Molecule Inhibitors'
          - '3rd Gen EGFR TKI (Osimertinib-Resistant Mutations)'
          - '4th Gen EGFR TKI (C797S Mutation Targeted)'
          - 'HER2 Exon 20 Insertion & Exon 19/21 Targeted TKIs'
          - 'Exon 20 Insertion / Rare Mutation EGFR TKIs'
          # Neuroscience Subcategories
          - 'General Neuroscience'
          - 'Neurodegenerative Diseases (Alzheimers / Parkinsons)'
          - 'Neuroimmunology & Multiple Sclerosis'
          # Immunology Subcategories
          - 'General Immunology'
          - 'Autoimmune & Inflammatory Diseases'
          # Anti-diabetics Subcategories
          - 'General Anti-diabetics'
          - 'GLP-1 / GIP / Glucagon Receptor Agonists'

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Biotech Catalyst Agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_SITE_ID: ${{ secrets.WP_SITE_ID }}
          WP_OAUTH_TOKEN: ${{ secrets.WP_OAUTH_TOKEN }}
          PUBLISH_STATUS: "publish"
          CATEGORY_NAME: ${{ github.event.inputs.category_name || 'All General Categories' }}
          SUBCATEGORY_NAME: ${{ github.event.inputs.subcategory_name || 'None (Use Primary Category selection)' }}
        run: |
          python main1.py
